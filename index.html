<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6a5e79058ec761efd47be7fe/0bc69a0d1_CateHub_ead040f72_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>CateqHub</title>
    <script>
      // Applies the theme before React mounts so the first paint is already the
      // right colour. Mirrors lib/ThemeContext.jsx exactly: same key, same
      // 'light' | 'dark' | 'system' values, 'system' (and anything unreadable)
      // resolving against the device. Keep both in sync.
      (function () {
        try {
          var pref = localStorage.getItem('cq-theme');
          if (pref !== 'light' && pref !== 'dark') pref = 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* localStorage/matchMedia unavailable — default to light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
